<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<!-- Firebase (salva os endereços dos convidados) -->
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="./firebase-enderecos.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Authentic Signature";src:url("assets/AuthenticSignature.otf") format("opentype");font-display:swap;}
html,body{margin:0;background:#F8F3EC;}
*{box-sizing:border-box;}
a{color:#1B47A4;}
a:hover{color:#D1287D;}
input::placeholder{color:#9AA8C8;}
</style>
</helmet>
<div data-screen-label="Endereço" style="min-height:100svh;background:#F8F3EC;font-family:Montserrat, sans-serif;color:#1B47A4;display:flex;flex-direction:column;align-items:center;padding:clamp(32px,7vh,72px) 20px 64px;">
  

  <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
    <form onSubmit="{{ onSubmit }}" style="width:100%;max-width:560px;margin-top:36px;background:#FFFFFF;border:1.5px solid #E7A9C6;border-radius:6px;padding:clamp(24px,5vw,40px);display:flex;flex-direction:column;gap:22px;box-shadow:0 14px 30px rgba(20,40,90,.08);">
      <div style="font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#D1287D;">Seus dados</div>
      <label style="display:flex;flex-direction:column;gap:8px;">
        <span style="font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;">Nome completo</span>
        <input name="nome" value="{{ f.nome }}" onChange="{{ onField }}" autoComplete="name" placeholder="Nome" style="height:50px;border:0;border-bottom:1.5px solid #1B47A4;background:transparent;font-family:Montserrat, sans-serif;font-size:16px;color:#1B47A4;padding:0 2px;outline:none;" style-focus="border-bottom-color:#D1287D;">
        <span style="font-size:12px;color:#D1287D;min-height:0;">{{ e.nome }}</span>
      </label>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px;">
        <label style="display:flex;flex-direction:column;gap:8px;">
          <span style="font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;">Telefone</span>
          <input name="telefone" type="tel" value="{{ f.telefone }}" onChange="{{ onField }}" autoComplete="tel" placeholder="(11) 90000-0000" style="height:50px;border:0;border-bottom:1.5px solid #1B47A4;background:transparent;font-family:Montserrat, sans-serif;font-size:16px;color:#1B47A4;padding:0 2px;outline:none;" style-focus="border-bottom-color:#D1287D;">
          <span style="font-size:12px;color:#D1287D;">{{ e.telefone }}</span>
        </label>
        <label style="display:flex;flex-direction:column;gap:8px;">
          <span style="font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;">E-mail</span>
          <input name="email" type="email" value="{{ f.email }}" onChange="{{ onField }}" autoComplete="email" placeholder="voce@email.com" style="height:50px;border:0;border-bottom:1.5px solid #1B47A4;background:transparent;font-family:Montserrat, sans-serif;font-size:16px;color:#1B47A4;padding:0 2px;outline:none;" style-focus="border-bottom-color:#D1287D;">
          <span style="font-size:12px;color:#D1287D;">{{ e.email }}</span>
        </label>
      </div>

      <div style="font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#D1287D;margin-top:10px;">ENDEREÇO</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:22px;">
        <label style="display:flex;flex-direction:column;gap:8px;">
          <span style="font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;">CEP</span>
          <input name="cep" inputMode="numeric" value="{{ f.cep }}" onChange="{{ onField }}" onBlur="{{ onCep }}" autoComplete="postal-code" placeholder="00000-000" style="height:50px;border:0;border-bottom:1.5px solid #1B47A4;background:transparent;font-family:Montserrat, sans-serif;font-size:16px;color:#1B47A4;padding:0 2px;outline:none;" style-focus="border-bottom-color:#D1287D;">
          <span style="font-size:12px;color:#D1287D;">{{ cepMsg }}</span>
        </label>
        <label style="display:flex;flex-direction:column;gap:8px;">
          <span style="font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;">Número</span>
          <input name="numero" value="{{ f.numero }}" onChange="{{ onField }}" placeholder="123" style="height:50px;border:0;border-bottom:1.5px solid #1B47A4;background:transparent;font-family:Montserrat, sans-serif;font-size:16px;color:#1B47A4;padding:0 2px;outline:none;" style-focus="border-bottom-color:#D1287D;">
          <span style="font-size:12px;color:#D1287D;">{{ e.numero }}</span>
        </label>
      </div>
      <label style="display:flex;flex-direction:column;gap:8px;">
        <span style="font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;">Rua</span>
        <input name="rua" value="{{ f.rua }}" onChange="{{ onField }}" autoComplete="address-line1" placeholder="Rua, avenida…" style="height:50px;border:0;border-bottom:1.5px solid #1B47A4;background:transparent;font-family:Montserrat, sans-serif;font-size:16px;color:#1B47A4;padding:0 2px;outline:none;" style-focus="border-bottom-color:#D1287D;">
        <span style="font-size:12px;color:#D1287D;">{{ e.rua }}</span>
      </label>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px;">
        <label style="display:flex;flex-direction:column;gap:8px;">
          <span style="font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;">Complemento</span>
          <input name="complemento" value="{{ f.complemento }}" onChange="{{ onField }}" autoComplete="address-line2" placeholder="Apto, bloco (opcional)" style="height:50px;border:0;border-bottom:1.5px solid #1B47A4;background:transparent;font-family:Montserrat, sans-serif;font-size:16px;color:#1B47A4;padding:0 2px;outline:none;" style-focus="border-bottom-color:#D1287D;">
        </label>
        <label style="display:flex;flex-direction:column;gap:8px;">
          <span style="font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;">Bairro</span>
          <input name="bairro" value="{{ f.bairro }}" onChange="{{ onField }}" placeholder="Bairro" style="height:50px;border:0;border-bottom:1.5px solid #1B47A4;background:transparent;font-family:Montserrat, sans-serif;font-size:16px;color:#1B47A4;padding:0 2px;outline:none;" style-focus="border-bottom-color:#D1287D;">
          <span style="font-size:12px;color:#D1287D;">{{ e.bairro }}</span>
        </label>
      </div>
      <div style="display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:22px;">
        <label style="display:flex;flex-direction:column;gap:8px;">
          <span style="font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;">Cidade</span>
          <input name="cidade" value="{{ f.cidade }}" onChange="{{ onField }}" autoComplete="address-level2" placeholder="Cidade" style="height:50px;border:0;border-bottom:1.5px solid #1B47A4;background:transparent;font-family:Montserrat, sans-serif;font-size:16px;color:#1B47A4;padding:0 2px;outline:none;" style-focus="border-bottom-color:#D1287D;">
          <span style="font-size:12px;color:#D1287D;">{{ e.cidade }}</span>
        </label>
        <label style="display:flex;flex-direction:column;gap:8px;">
          <span style="font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;">UF</span>
          <input name="uf" value="{{ f.uf }}" onChange="{{ onField }}" maxLength="2" autoComplete="address-level1" placeholder="SP" style="height:50px;border:0;border-bottom:1.5px solid #1B47A4;background:transparent;font-family:Montserrat, sans-serif;font-size:16px;color:#1B47A4;padding:0 2px;outline:none;text-transform:uppercase;" style-focus="border-bottom-color:#D1287D;">
          <span style="font-size:12px;color:#D1287D;">{{ e.uf }}</span>
        </label>
      </div>

      <button type="submit" disabled="{{ sending }}" style="margin-top:12px;min-height:56px;border:0;border-radius:999px;background:#1B47A4;color:#FFFFFF;font-family:Montserrat, sans-serif;font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;transition:background .2s ease;" style-hover="background:#D1287D;">{{ submitLabel }}</button>
      <span style="font-size:13px;color:#D1287D;text-align:center;">{{ sendError }}</span>
    </form>
  </sc-if>

  <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
    <div style="width:100%;max-width:560px;margin-top:36px;background:#FFFFFF;border:1.5px solid #E7A9C6;border-radius:6px;padding:48px 28px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;box-shadow:0 14px 30px rgba(20,40,90,.08);">
      <div style="font-family:'Authentic Signature', cursive;font-size:64px;line-height:1.15;color:#1B47A4;">Obrigado!</div>
      
    </div>
  </sc-if>

  <a href="./" style="margin-top:28px;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;padding:12px;">← Voltar ao save the date</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;submitUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Envio&quot;}}">class Component extends DCLogic {
  state = { f: { nome:'', telefone:'', email:'', cep:'', rua:'', numero:'', complemento:'', bairro:'', cidade:'', uf:'' }, e: {}, sent: false, sending: false, cepMsg: '', sendError: '' };
  maskPhone(v){ const d=v.replace(/\D/g,'').slice(0,11); if(d.length<=2) return d.length?'('+d:''; if(d.length<=6) return `(${d.slice(0,2)}) ${d.slice(2)}`; if(d.length<=10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`; return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`; }
  maskCep(v){ const d=v.replace(/\D/g,'').slice(0,8); return d.length>5?d.slice(0,5)+'-'+d.slice(5):d; }
  onField = (ev) => { let { name, value } = ev.target; if(name==='telefone') value=this.maskPhone(value); if(name==='cep') value=this.maskCep(value); if(name==='uf') value=value.toUpperCase(); this.setState(s => ({ f: { ...s.f, [name]: value }, e: { ...s.e, [name]: '' } })); if(name==='cep' && value.length===9) this.lookupCep(value); };
  onCep = () => { if(this.state.f.cep.length===9) this.lookupCep(this.state.f.cep); };
  async lookupCep(cep){ if(this._lastCep===cep) return; this._lastCep=cep; this.setState({ cepMsg:'Buscando…' });
    try { const r=await fetch(`https://viacep.com.br/ws/${cep.replace('-','')}/json/`); const j=await r.json();
      if(j.erro){ this.setState({ cepMsg:'CEP não encontrado' }); return; }
      this.setState(s => ({ cepMsg:'', f: { ...s.f, rua: s.f.rua || j.logradouro || '', bairro: s.f.bairro || j.bairro || '', cidade: j.localidade || s.f.cidade, uf: j.uf || s.f.uf } }));
    } catch(_) { this.setState({ cepMsg:'' }); } }
  validate(f){ const e={}; const req={nome:'Informe seu nome',telefone:'Informe seu telefone',email:'Informe seu e-mail',rua:'Informe a rua',numero:'Informe o número',bairro:'Informe o bairro',cidade:'Informe a cidade',uf:'UF'};
    for(const k in req) if(!f[k].trim()) e[k]=req[k];
    if(f.email && !/^\S+@\S+\.\S+$/.test(f.email)) e.email='E-mail inválido';
    if(f.telefone && f.telefone.replace(/\D/g,'').length<10) e.telefone='Telefone incompleto';
    if(f.cep && f.cep.length!==9) this.setState({ cepMsg:'CEP incompleto' });
    return e; }
  onSubmit = async (ev) => { ev.preventDefault(); const { f } = this.state; const e=this.validate(f); if(Object.keys(e).length){ this.setState({ e }); return; }
    const url=this.props.submitUrl; this.setState({ sending:true, sendError:'' });
    try { if(window.saveEndereco) { await window.saveEndereco(f); }
      else if(url) { const r=await fetch(url,{ method:'POST', headers:{ 'Content-Type':'application/json', Accept:'application/json' }, body: JSON.stringify(f) }); if(!r.ok) throw new Error(); }
      this.setState({ sent:true, sending:false }); window.scrollTo({ top:0, behavior:'smooth' });
    } catch(_) { this.setState({ sending:false, sendError:'Não foi possível enviar. Tente novamente.' }); } };
  renderVals(){ const s=this.state; return { f:s.f, e:s.e, sent:s.sent, notSent:!s.sent, sending:s.sending, cepMsg:s.cepMsg || '', sendError:s.sendError, submitLabel: s.sending?'Enviando…':'Enviar', firstName:(s.f.nome.trim().split(' ')[0]||''), onField:this.onField, onCep:this.onCep, onSubmit:this.onSubmit }; }
}</script>
</body>
</html>
